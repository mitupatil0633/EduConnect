<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reading Practice - EduConnect</title>

    <link rel="stylesheet"
          href="style.css">

    <style>

        /* =====================================
           COLORFUL READING PAGE
        ===================================== */

        body {
            background: linear-gradient( 135deg, #eef2ff, #f0f9ff, #fdf4ff );
        }


        /* =====================================
           NAVBAR
        ===================================== */

        .navbar {
            background: linear-gradient( 90deg, #1e3a8a, #4f46e5, #7c3aed );
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.25);
        }

            .navbar .logo {
                color: white;
                font-weight: bold;
            }

            .navbar nav a {
                color: white;
                font-weight: 600;
                transition: 0.25s;
            }

                .navbar nav a:hover {
                    background: rgba(255, 255, 255, 0.15);
                    border-radius: 8px;
                }


        /* =====================================
           MAIN PAGE
        ===================================== */

        .reading-page {
            max-width: 950px;
            margin: 0 auto;
            padding: 40px 20px;
        }


        /* =====================================
           HEADER
        ===================================== */

        .reading-header {
            text-align: center;
            margin-bottom: 35px;
            background: linear-gradient( 135deg, #ffffff, #eef2ff );
            padding: 30px 20px;
            border-radius: 22px;
            border: 2px solid #e0e7ff;
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.13);
        }

            .reading-header .welcome {
                color: #2563eb;
                font-weight: bold;
                letter-spacing: 3px;
                margin-bottom: 8px;
            }

            .reading-header h1 {
                margin: 10px 0;
                color: #3730a3;
                font-size: 34px;
            }

        .standard-badge {
            display: inline-block;
            margin-top: 10px;
            padding: 9px 24px;
            border-radius: 25px;
            background: linear-gradient( 90deg, #2563eb, #7c3aed );
            color: white;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.25);
        }

        #readingDescription {
            margin-top: 14px;
            font-size: 17px;
            color: #64748b;
            line-height: 1.6;
        }


        /* =====================================
           READING CARDS
        ===================================== */

        .reading-card {
            background: white;
            padding: 28px;
            margin-bottom: 28px;
            border-radius: 20px;
            border: 2px solid #e0e7ff;
            box-shadow: 0 8px 22px rgba(79, 70, 229, 0.10);
            transition: 0.25s;
        }

            .reading-card:hover {
                transform: translateY(-3px);
                box-shadow: 0 12px 28px rgba(79, 70, 229, 0.15);
            }

            .reading-card h2 {
                margin-top: 0;
                margin-bottom: 18px;
                color: #3730a3;
                font-size: 24px;
            }


            /* =====================================
           PASSAGE CARD
        ===================================== */

            .reading-card:first-of-type {
                background: linear-gradient( 135deg, #ffffff, #eff6ff );
                border-color: #bfdbfe;
            }

                .reading-card:first-of-type h2 {
                    color: #2563eb;
                }

        .passage {
            font-size: 18px;
            line-height: 1.9;
            margin-bottom: 0;
            color: #475569;
            padding: 20px;
            background: rgba(255, 255, 255, 0.75);
            border-radius: 14px;
            border-left: 6px solid #2563eb;
        }


        /* =====================================
           QUESTION CARD
        ===================================== */

        .reading-card:nth-of-type(2) {
            background: linear-gradient( 135deg, #ffffff, #f5f3ff );
            border-color: #c4b5fd;
        }

            .reading-card:nth-of-type(2) h2 {
                color: #7c3aed;
            }


        /* =====================================
           QUESTION
        ===================================== */

        .question {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #334155;
            line-height: 1.6;
            padding: 16px;
            background: #faf5ff;
            border-radius: 12px;
            border-left: 5px solid #7c3aed;
        }


        /* =====================================
           ANSWER BUTTONS
        ===================================== */

        .answer-button {
            display: block;
            width: 100%;
            padding: 16px 18px;
            margin: 12px 0;
            border: 2px solid #ddd6fe;
            border-radius: 12px;
            background: linear-gradient( 90deg, #eef2ff, #f5f3ff );
            color: #334155;
            font-size: 16px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: 0.25s;
        }

            .answer-button:hover {
                background: linear-gradient( 90deg, #dbeafe, #ede9fe );
                border-color: #818cf8;
                transform: translateX(4px);
                box-shadow: 0 5px 12px rgba(79, 70, 229, 0.12);
            }

            .answer-button:disabled {
                cursor: default;
            }

            .answer-button.correct {
                background: linear-gradient( 90deg, #dcfce7, #bbf7d0 );
                border-color: #22c55e;
                color: #166534;
                box-shadow: 0 5px 15px rgba(34, 197, 94, 0.15);
            }

            .answer-button.wrong {
                background: linear-gradient( 90deg, #fee2e2, #fecdd3 );
                border-color: #ef4444;
                color: #991b1b;
                box-shadow: 0 5px 15px rgba(239, 68, 68, 0.12);
            }


        /* =====================================
           RESULT
        ===================================== */

        #readingResult {
            margin-top: 22px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #3730a3;
            padding: 14px;
            border-radius: 12px;
            background: #eef2ff;
        }

        #readingScore {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-top: 12px;
            color: #2563eb;
            padding: 12px;
        }


        /* =====================================
           BACK BUTTON
        ===================================== */

        .back-area {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 20px;
        }

            .back-area button {
                padding: 14px 28px;
                border: none;
                border-radius: 12px;
                background: linear-gradient( 90deg, #2563eb, #7c3aed );
                color: white;
                font-size: 16px;
                font-weight: bold;
                cursor: pointer;
                box-shadow: 0 6px 15px rgba(79, 70, 229, 0.22);
                transition: 0.25s;
            }

                .back-area button:hover {
                    transform: translateY(-2px);
                    box-shadow: 0 9px 20px rgba(79, 70, 229, 0.30);
                }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 600px) {

            .reading-page {
                padding: 25px 15px;
            }

            .reading-header {
                padding: 25px 15px;
            }

                .reading-header h1 {
                    font-size: 27px;
                }

            .reading-card {
                padding: 20px;
            }

                .reading-card h2 {
                    font-size: 21px;
                }

            .passage {
                font-size: 16px;
                line-height: 1.8;
                padding: 16px;
            }

            .question {
                font-size: 17px;
            }

            .answer-button {
                padding: 15px;
            }
        }
    </style>

</head>


<body>


    <!-- =========================================
         NAVIGATION
    ========================================= -->

    <header class="navbar">

        <div class="logo">
            🎓 EduConnect
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="student-dashboard.html">
                Dashboard
            </a>

            <a href="subjects.html">
                Subjects
            </a>

            <a href="english.html">
                English
            </a>

        </nav>

    </header>



    <!-- =========================================
         MAIN PAGE
    ========================================= -->

    <main class="reading-page">


        <!-- =====================================
             PAGE HEADER
        ====================================== -->

        <div class="reading-header">

            <p class="welcome">
                ENGLISH
            </p>

            <h1>
                📖 Reading Practice
            </h1>

            <div class="standard-badge">

                Standard
                <span id="standardNumber">
                    1
                </span>

            </div>

            <p id="readingDescription">
                Reading practice for your standard.
            </p>

        </div>



        <!-- =====================================
             PASSAGE CARD
        ===================================== -->

        <section class="reading-card">

            <h2 id="passageTitle">
                📖 Reading Passage
            </h2>

            <p id="passageText"
               class="passage">

                Loading reading passage...

            </p>

        </section>



        <!-- =====================================
             QUESTION CARD
        ===================================== -->

        <section class="reading-card">

            <h2>
                🧠 Reading Question
            </h2>

            <p id="readingQuestion"
               class="question">

                Loading question...

            </p>

            <div id="answerContainer"></div>

            <p id="readingResult"></p>

            <p id="readingScore"></p>

        </section>



        <!-- =====================================
             BACK BUTTON
        ===================================== -->

        <div class="back-area">

            <button onclick="window.location.href='english.html'">

                ← Back to English

            </button>

        </div>


    </main>



    <!-- =========================================
         READING JAVASCRIPT
    ========================================= -->

    <script>

        /* =========================================
           GET STUDENT STANDARD
        ========================================= */

        let standard =
            parseInt(
                localStorage.getItem("studentStandard")
            ) || 1;


        /* Make sure standard is 1–5 */

        if (
            standard < 1 ||
            standard > 5
        ) {

            standard = 1;

        }


        /* Show standard */

        document.getElementById(
            "standardNumber"
        ).textContent = standard;



        /* =========================================
           STANDARD-SPECIFIC READING CONTENT
        ========================================= */

        const readingContent = {

            1: {

                description:
                    "Standard 1 Reading - Read simple sentences and understand basic information.",

                title:
                    "🐱 The Little Cat",

                passage:
                    "Mia has a little cat. The cat is white. " +
                    "It likes to play with a ball. " +
                    "Mia gives the cat some food every morning.",

                question:
                    "What colour is Mia's cat?",

                options: [
                    "White",
                    "Blue",
                    "Green",
                    "Black"
                ],

                answer:
                    "White"

            },


            2: {

                description:
                    "Standard 2 Reading - Read a short passage and find important details.",

                title:
                    "🌳 A Day in the Garden",

                passage:
                    "Ravi visits his grandmother's garden every Sunday. " +
                    "He helps her water the plants. " +
                    "There are many flowers and small trees in the garden. " +
                    "Ravi enjoys watching the butterflies.",

                question:
                    "When does Ravi visit his grandmother's garden?",

                options: [
                    "Every Sunday",
                    "Every Monday",
                    "Every Friday",
                    "Every Saturday"
                ],

                answer:
                    "Every Sunday"

            },


            3: {

                description:
                    "Standard 3 Reading - Identify the main idea and important details.",

                title:
                    "🌱 Maya's Plant",

                passage:
                    "Maya planted a small seed in a pot. " +
                    "She placed the pot near a sunny window and watered the seed regularly. " +
                    "After several days, a small green shoot appeared. " +
                    "Maya was happy to see her plant growing.",

                question:
                    "Why did Maya place the pot near a sunny window?",

                options: [
                    "To help the plant grow",
                    "To keep the pot empty",
                    "To hide the seed",
                    "To clean the window"
                ],

                answer:
                    "To help the plant grow"

            },


            4: {

                description:
                    "Standard 4 Reading - Understand main ideas, details and simple conclusions.",

                title:
                    "🌊 Protecting Our Rivers",

                passage:
                    "Rivers provide water for people, animals and plants. " +
                    "However, throwing waste into rivers can make the water dirty and unsafe. " +
                    "People can help protect rivers by putting rubbish in proper bins " +
                    "and keeping water sources clean.",

                question:
                    "How can people help protect rivers?",

                options: [
                    "By keeping water sources clean",
                    "By throwing rubbish into rivers",
                    "By wasting water",
                    "By leaving waste near rivers"
                ],

                answer:
                    "By keeping water sources clean"

            },


            5: {

                description:
                    "Standard 5 Reading - Identify ideas, supporting details and meaning from context.",

                title:
                    "🌍 The Importance of Trees",

                passage:
                    "Trees are important because they provide oxygen, shade and homes for many animals. " +
                    "They also help protect the soil and make the environment greener. " +
                    "Planting and caring for trees is one way people can help protect nature.",

                question:
                    "Which idea is mainly supported by the passage?",

                options: [
                    "Trees are important for people and nature",
                    "Trees are only useful for shade",
                    "Animals do not need trees",
                    "Planting trees harms the environment"
                ],

                answer:
                    "Trees are important for people and nature"

            }

        };



        /* =========================================
           GET CURRENT CONTENT
        ========================================= */

        const currentReading =
            readingContent[standard] ||
            readingContent[1];



        /* =========================================
           DISPLAY CONTENT
        ========================================= */

        document.getElementById(
            "readingDescription"
        ).textContent =
            currentReading.description;


        document.getElementById(
            "passageTitle"
        ).textContent =
            currentReading.title;


        document.getElementById(
            "passageText"
        ).textContent =
            currentReading.passage;


        document.getElementById(
            "readingQuestion"
        ).textContent =
            currentReading.question;



        /* =========================================
           CREATE ANSWER BUTTONS
        ========================================= */

        const answerContainer =
            document.getElementById(
                "answerContainer"
            );


        let answered = false;

        let score = 0;


        currentReading.options.forEach(
            function (option) {

                const button =
                    document.createElement(
                        "button"
                    );

                button.type = "button";

                button.className =
                    "answer-button";

                button.textContent =
                    option;


                button.onclick =
                    function () {

                        if (answered) {

                            return;

                        }


                        answered = true;


                        /* Check selected answer */

                        if (
                            option ===
                            currentReading.answer
                        ) {

                            score = 1;

                            button.classList.add(
                                "correct"
                            );


                            document.getElementById(
                                "readingResult"
                            ).textContent =
                                "✅ Correct! Great job!";

                        }

                        else {

                            score = 0;

                            button.classList.add(
                                "wrong"
                            );


                            /* Show correct answer */

                            const allButtons =
                                answerContainer.querySelectorAll(
                                    ".answer-button"
                                );


                            allButtons.forEach(
                                function (btn) {

                                    if (
                                        btn.textContent ===
                                        currentReading.answer
                                    ) {

                                        btn.classList.add(
                                            "correct"
                                        );

                                    }

                                }
                            );


                            document.getElementById(
                                "readingResult"
                            ).textContent =
                                "❌ Not quite. The correct answer is shown in green.";

                        }


                        /* Disable all buttons */

                        const allButtons =
                            answerContainer.querySelectorAll(
                                ".answer-button"
                            );


                        allButtons.forEach(
                            function (btn) {

                                btn.disabled = true;

                            }
                        );


                        /* Save Reading score */

                        localStorage.setItem(
                            "englishReadingScore",
                            score
                        );


                        localStorage.setItem(
                            "readingScore",
                            score
                        );


                        /* Show score */

                        document.getElementById(
                            "readingScore"
                        ).textContent =
                            "Reading Score: " +
                            score +
                            "/1";

                    };


                answerContainer.appendChild(
                    button
                );

            }
        );

    </script>


</body>

</html>
