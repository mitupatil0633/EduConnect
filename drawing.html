<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Drawing Zone - EduConnect</title>

    <link rel="stylesheet"
          href="style.css">

    <style>

        /* =========================
           GLOBAL
        ========================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient( 135deg, #eef2ff, #f0f9ff, #fdf4ff );
            color: #334155;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            background: linear-gradient( 135deg, #1e3a8a, #4f46e5, #7c3aed );
            box-shadow: 0 5px 20px rgba(79, 70, 229, 0.25);
        }

            .navbar .logo {
                color: white;
                font-weight: bold;
            }

            .navbar nav a {
                color: white;
                font-weight: bold;
                text-decoration: none;
                transition: 0.2s;
            }

                .navbar nav a:hover {
                    color: #ddd6fe;
                    transform: translateY(-1px);
                }


        /* =========================
           MAIN PAGE
        ========================= */

        .drawing-page {
            width: 92%;
            max-width: 1050px;
            margin: 35px auto;
            text-align: center;
        }


        /* =========================
           HEADER
        ========================= */

        .drawing-header {
            background: linear-gradient( 135deg, #ffffff, #eef2ff );
            padding: 32px 20px;
            border-radius: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.12);
            border: 2px solid #c7d2fe;
        }

            .drawing-header .welcome {
                display: inline-block;
                margin: 0 0 12px;
                padding: 9px 18px;
                border-radius: 25px;
                background: linear-gradient( 135deg, #dbeafe, #ede9fe );
                border: 2px solid #a5b4fc;
                color: #3730a3;
                font-size: 15px;
                font-weight: 800;
            }

            .drawing-header h1 {
                margin: 5px 0 12px;
                color: #3730a3;
                font-size: 35px;
            }

            .drawing-header > p:last-child {
                margin: 0;
                color: #64748b;
                font-size: 17px;
                font-weight: 500;
            }


        /* =========================
           DRAWING TOOLS
        ========================= */

        .drawing-tools {
            background: linear-gradient( 135deg, #ffffff, #f5f3ff );
            padding: 28px;
            border-radius: 24px;
            box-shadow: 0 10px 28px rgba(79, 70, 229, 0.12);
            margin-bottom: 22px;
            border: 2px solid #ddd6fe;
        }

            .drawing-tools h2 {
                margin-top: 0;
                color: #5b21b6;
                font-size: 25px;
            }

            .drawing-tools label {
                font-weight: 800;
                color: #475569;
                margin-right: 7px;
            }

            .drawing-tools input {
                margin-right: 18px;
            }


        /* =========================
           COLOR PICKER
        ========================= */

        #penColor {
            width: 58px;
            height: 40px;
            border: 3px solid #a5b4fc;
            border-radius: 10px;
            cursor: pointer;
            vertical-align: middle;
            background: white;
        }


        /* =========================
           PEN SIZE
        ========================= */

        #penSize {
            accent-color: #6366f1;
            vertical-align: middle;
        }

        #sizeValue {
            display: inline-block;
            min-width: 40px;
            padding: 6px 10px;
            border-radius: 10px;
            background: #e0e7ff;
            color: #4338ca;
            font-weight: bold;
            border: 1px solid #c7d2fe;
        }


        /* =========================
           DRAWING BUTTONS
        ========================= */

        .drawing-buttons {
            margin-top: 22px;
        }

            .drawing-buttons button,
            .drawing-page > button {
                margin: 5px;
                padding: 12px 20px;
                border: none;
                border-radius: 14px;
                color: white;
                font-weight: bold;
                font-size: 14px;
                cursor: pointer;
                transition: 0.25s;
                box-shadow: 0 5px 14px rgba(79, 70, 229, 0.18);
            }


                /* Pen */

                .drawing-buttons button:nth-child(1) {
                    background: linear-gradient( 135deg, #2563eb, #4f46e5 );
                }


                /* Eraser */

                .drawing-buttons button:nth-child(2) {
                    background: linear-gradient( 135deg, #7c3aed, #a855f7 );
                }


                /* Clear */

                .drawing-buttons button:nth-child(3) {
                    background: linear-gradient( 135deg, #e11d48, #ec4899 );
                }


                /* Save */

                .drawing-buttons button:nth-child(4) {
                    background: linear-gradient( 135deg, #059669, #10b981 );
                }

                .drawing-buttons button:hover,
                .drawing-page > button:hover {
                    transform: translateY(-3px);
                    box-shadow: 0 8px 18px rgba(79, 70, 229, 0.25);
                }


        /* =========================
           CANVAS AREA
        ========================= */

        .canvas-container {
            background: linear-gradient( 135deg, #ffffff, #f8fafc );
            padding: 18px;
            border-radius: 24px;
            box-shadow: 0 10px 28px rgba(79, 70, 229, 0.12);
            border: 2px solid #c7d2fe;
        }

        #drawingCanvas {
            display: block;
            width: 100%;
            max-width: 900px;
            height: 500px;
            margin: auto;
            background: white;
            border: 4px solid #818cf8;
            border-radius: 17px;
            cursor: crosshair;
            touch-action: none;
            box-shadow: inset 0 0 15px rgba(99, 102, 241, 0.08);
        }


        /* =========================
           MESSAGE
        ========================= */

        #drawingMessage {
            display: inline-block;
            font-weight: 800;
            margin-top: 18px;
            padding: 11px 20px;
            border-radius: 22px;
            background: linear-gradient( 135deg, #dbeafe, #ede9fe );
            color: #4338ca;
            border: 2px solid #a5b4fc;
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.10);
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back-button {
            margin-top: 20px;
            background: linear-gradient( 135deg, #2563eb, #7c3aed );
        }

            .back-button:hover {
                background: linear-gradient( 135deg, #1d4ed8, #6d28d9 );
            }


        /* =========================
           FOOTER
        ========================= */

        footer {
            margin-top: 45px;
            padding: 30px 20px;
            text-align: center;
            background: linear-gradient( 135deg, #1e3a8a, #4f46e5, #7c3aed );
            color: #e0e7ff;
            border-top: none;
        }

            footer h3 {
                color: white;
                margin-bottom: 8px;
            }

            footer p {
                margin: 6px;
            }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .drawing-page {
                width: 94%;
                margin-top: 25px;
            }

            .drawing-header {
                padding: 25px 15px;
            }

                .drawing-header h1 {
                    font-size: 28px;
                }

                .drawing-header > p:last-child {
                    font-size: 15px;
                }

            .drawing-tools {
                padding: 22px 15px;
            }

                .drawing-tools label {
                    display: inline-block;
                    margin-top: 10px;
                }

                .drawing-tools input {
                    margin-right: 5px;
                }

            #penColor {
                width: 52px;
                height: 38px;
            }

            #drawingCanvas {
                height: 400px;
            }

            .drawing-buttons button {
                width: 90%;
                margin: 6px auto;
            }

            .drawing-page > button {
                width: 90%;
            }
        }
    </style>

</head>


<body>


    <!-- =========================
         NAVIGATION
    ========================= -->

    <header class="navbar">

        <div class="logo">
            🎓 EduConnect
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="student-dashboard.html">
                Dashboard
            </a>

            <a href="subjects.html">
                Subjects
            </a>

            <a href="activities.html">
                Activities
            </a>

            <a href="#" onclick="logoutStudent()">
                Logout
            </a>

        </nav>

    </header>


    <!-- =========================
         DRAWING PAGE
    ========================= -->

    <main class="drawing-page">


        <!-- HEADER -->

        <div class="drawing-header">

            <p class="welcome">
                🎨 FUN LEARNING ZONE
            </p>

            <h1>
                🎨 Drawing Zone
            </h1>

            <p>
                Draw, sketch and create your own picture!
            </p>

        </div>


        <!-- =========================
             TOOLS
        ========================= -->

        <section class="drawing-tools">

            <h2>
                🖌️ Drawing Tools
            </h2>


            <label for="penColor">
                Pen Color:
            </label>

            <input type="color"
                   id="penColor"
                   value="#000000">


            <label for="penSize">
                Pen Size:
            </label>

            <input type="range"
                   id="penSize"
                   min="1"
                   max="30"
                   value="5">

            <span id="sizeValue">
                5
            </span>


            <div class="drawing-buttons">

                <button onclick="setPen()">
                    🖊️ Pen
                </button>

                <button onclick="setEraser()">
                    🧽 Eraser
                </button>

                <button onclick="clearDrawing()">
                    🗑️ Clear
                </button>

                <button onclick="saveDrawing()">
                    💾 Save Drawing
                </button>

            </div>

        </section>


        <!-- =========================
             CANVAS
        ========================= -->

        <section class="canvas-container">

            <canvas id="drawingCanvas">
            </canvas>

        </section>


        <!-- MESSAGE -->

        <p id="drawingMessage">
            🖌️ Start drawing!
        </p>


        <br>


        <!-- BACK -->

        <button class="back-button"
                onclick="window.location.href='activities.html'">

            ← Back to Fun Activities

        </button>


    </main>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        <h3>
            🎓 EduConnect
        </h3>

        <p>
            Smart learning for young minds.
        </p>

        <p>
            © 2026 EduConnect
        </p>

    </footer>


    <!-- =========================
         DRAWING JAVASCRIPT
    ========================= -->

    <script>

        const canvas =
            document.getElementById("drawingCanvas");

        const ctx =
            canvas.getContext("2d");

        const penColor =
            document.getElementById("penColor");

        const penSize =
            document.getElementById("penSize");

        const sizeValue =
            document.getElementById("sizeValue");

        const drawingMessage =
            document.getElementById("drawingMessage");


        let drawing = false;

        let erasing = false;


        /* =========================
           RESIZE CANVAS
        ========================= */

        function resizeCanvas() {

            const ratio =
                window.devicePixelRatio || 1;

            const rect =
                canvas.getBoundingClientRect();

            canvas.width =
                rect.width * ratio;

            canvas.height =
                rect.height * ratio;

            ctx.setTransform(
                ratio,
                0,
                0,
                ratio,
                0,
                0
            );

        }


        /* =========================
           GET POINTER POSITION
        ========================= */

        function getPosition(event) {

            const rect =
                canvas.getBoundingClientRect();

            return {

                x:
                    event.clientX -
                    rect.left,

                y:
                    event.clientY -
                    rect.top

            };

        }


        /* =========================
           START DRAWING
        ========================= */

        function startDrawing(event) {

            drawing = true;

            const position =
                getPosition(event);

            ctx.beginPath();

            ctx.moveTo(
                position.x,
                position.y
            );

            event.preventDefault();

        }


        /* =========================
           DRAW
        ========================= */

        function draw(event) {

            if (!drawing) {
                return;
            }

            const position =
                getPosition(event);


            ctx.lineWidth =
                penSize.value;

            ctx.lineCap =
                "round";


            if (erasing) {

                ctx.globalCompositeOperation =
                    "destination-out";

            } else {

                ctx.globalCompositeOperation =
                    "source-over";

                ctx.strokeStyle =
                    penColor.value;

            }


            ctx.lineTo(
                position.x,
                position.y
            );

            ctx.stroke();


            event.preventDefault();

        }


        /* =========================
           STOP DRAWING
        ========================= */

        function stopDrawing() {

            drawing = false;

            ctx.beginPath();

        }


        /* =========================
           POINTER EVENTS
        ========================= */

        canvas.addEventListener(
            "pointerdown",
            startDrawing
        );

        canvas.addEventListener(
            "pointermove",
            draw
        );

        canvas.addEventListener(
            "pointerup",
            stopDrawing
        );

        canvas.addEventListener(
            "pointerleave",
            stopDrawing
        );


        /* =========================
           PEN SIZE
        ========================= */

        penSize.addEventListener(
            "input",
            function () {

                sizeValue.textContent =
                    penSize.value;

            }
        );


        /* =========================
           PEN
        ========================= */

        function setPen() {

            erasing = false;

            ctx.globalCompositeOperation =
                "source-over";

            drawingMessage.textContent =
                "🖊️ Pen selected";

        }


        /* =========================
           ERASER
        ========================= */

        function setEraser() {

            erasing = true;

            drawingMessage.textContent =
                "🧽 Eraser selected";

        }


        /* =========================
           CLEAR
        ========================= */

        function clearDrawing() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            drawingMessage.textContent =
                "🗑️ Drawing cleared!";

        }


        /* =========================
           SAVE DRAWING
        ========================= */

        function saveDrawing() {

            const link =
                document.createElement("a");


            link.download =
                "EduConnect-Drawing.png";


            link.href =
                canvas.toDataURL(
                    "image/png"
                );


            link.click();


            /* UNLOCK CREATIVE ARTIST */

            localStorage.setItem(
                "visitedDrawing",
                "true"
            );


            drawingMessage.textContent =
                "💾 Drawing saved! 🎨 Creative Artist unlocked!";

        }


        /* =========================
           MARK DRAWING VISITED
        ========================= */

        localStorage.setItem(
            "visitedDrawing",
            "true"
        );


        /* =========================
           RESIZE
        ========================= */

        window.addEventListener(
            "resize",
            resizeCanvas
        );


        resizeCanvas();

    </script>


    <script src="script.js"></script>

</body>

</html>
