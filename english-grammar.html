<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Grammar Practice - EduConnect</title>

    <link rel="stylesheet"
          href="style.css">

    <style>

        /* =====================================
           COLORFUL GRAMMAR PAGE
        ===================================== */

        body {
            background: linear-gradient( 135deg, #eef2ff, #f0f9ff, #fdf4ff );
        }


        /* =====================================
           NAVBAR
        ===================================== */

        .navbar {
            background: linear-gradient( 90deg, #1e3a8a, #4f46e5, #7c3aed );
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.25);
        }

            .navbar .logo {
                color: white;
                font-weight: bold;
            }

            .navbar nav a {
                color: white;
                font-weight: 600;
                transition: 0.25s;
            }

                .navbar nav a:hover {
                    background: rgba(255, 255, 255, 0.15);
                    border-radius: 8px;
                }


        /* =====================================
           MAIN PAGE
        ===================================== */

        .grammar-page {
            max-width: 950px;
            margin: 0 auto;
            padding: 40px 20px;
        }


        /* =====================================
           HEADER
        ===================================== */

        .grammar-header {
            text-align: center;
            margin-bottom: 35px;
            background: linear-gradient( 135deg, #ffffff, #eef2ff );
            padding: 30px 20px;
            border-radius: 22px;
            border: 2px solid #e0e7ff;
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.13);
        }

            .grammar-header .welcome {
                color: #2563eb;
                font-weight: bold;
                letter-spacing: 3px;
                margin-bottom: 8px;
            }

            .grammar-header h1 {
                margin: 10px 0;
                color: #3730a3;
                font-size: 34px;
            }

        .standard-badge {
            display: inline-block;
            margin-top: 10px;
            padding: 9px 24px;
            border-radius: 25px;
            background: linear-gradient( 90deg, #2563eb, #7c3aed );
            color: white;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.25);
        }

        #grammarDescription {
            margin-top: 14px;
            color: #64748b;
            font-size: 17px;
            line-height: 1.6;
        }


        /* =====================================
           GRAMMAR CARD
        ===================================== */

        .grammar-card {
            background: white;
            padding: 28px;
            margin-bottom: 28px;
            border-radius: 20px;
            border: 2px solid #e0e7ff;
            box-shadow: 0 8px 22px rgba(79, 70, 229, 0.10);
            transition: 0.25s;
        }

            .grammar-card:hover {
                transform: translateY(-3px);
                box-shadow: 0 12px 28px rgba(79, 70, 229, 0.15);
            }

            .grammar-card h2 {
                margin-top: 0;
                margin-bottom: 20px;
                color: #3730a3;
                font-size: 24px;
            }


        /* =====================================
           GRAMMAR RULES
        ===================================== */

        .rule-item {
            padding: 17px;
            margin: 14px 0;
            border-radius: 14px;
            background: linear-gradient( 135deg, #ffffff, #eff6ff );
            border-left: 6px solid #2563eb;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
            transition: 0.2s;
        }

            .rule-item:nth-child(2) {
                background: linear-gradient( 135deg, #ffffff, #f5f3ff );
                border-left-color: #7c3aed;
            }

            .rule-item:nth-child(3) {
                background: linear-gradient( 135deg, #ffffff, #fdf2f8 );
                border-left-color: #ec4899;
            }

            .rule-item:hover {
                transform: translateX(4px);
            }

        .rule-title {
            font-size: 19px;
            font-weight: bold;
            color: #3730a3;
            margin-bottom: 5px;
        }

        .rule-example {
            margin-top: 6px;
            font-size: 16px;
            color: #64748b;
            line-height: 1.6;
        }


        /* =====================================
           QUESTION
        ===================================== */

        .question {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #334155;
            line-height: 1.6;
            padding: 16px;
            background: #f8fafc;
            border-radius: 12px;
            border-left: 5px solid #7c3aed;
        }


        /* =====================================
           ANSWER BUTTONS
        ===================================== */

        .answer-button {
            display: block;
            width: 100%;
            padding: 16px 18px;
            margin: 12px 0;
            border: 2px solid #e0e7ff;
            border-radius: 12px;
            background: linear-gradient( 90deg, #eef2ff, #f5f3ff );
            color: #334155;
            font-size: 16px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: 0.25s;
        }

            .answer-button:hover {
                background: linear-gradient( 90deg, #dbeafe, #ede9fe );
                border-color: #818cf8;
                transform: translateX(4px);
                box-shadow: 0 5px 12px rgba(79, 70, 229, 0.12);
            }

            .answer-button:disabled {
                cursor: default;
            }

            .answer-button.correct {
                background: linear-gradient( 90deg, #dcfce7, #bbf7d0 );
                border-color: #22c55e;
                color: #166534;
                box-shadow: 0 5px 15px rgba(34, 197, 94, 0.15);
            }

            .answer-button.wrong {
                background: linear-gradient( 90deg, #fee2e2, #fecdd3 );
                border-color: #ef4444;
                color: #991b1b;
                box-shadow: 0 5px 15px rgba(239, 68, 68, 0.12);
            }


        /* =====================================
           RESULT
        ===================================== */

        #grammarResult {
            margin-top: 22px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #3730a3;
            padding: 14px;
            border-radius: 12px;
            background: #eef2ff;
        }

        #grammarScore {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-top: 12px;
            color: #2563eb;
            padding: 12px;
        }


        /* =====================================
           BACK BUTTON
        ===================================== */

        .back-area {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 20px;
        }

            .back-area button {
                padding: 14px 28px;
                border: none;
                border-radius: 12px;
                background: linear-gradient( 90deg, #2563eb, #7c3aed );
                color: white;
                font-size: 16px;
                font-weight: bold;
                cursor: pointer;
                box-shadow: 0 6px 15px rgba(79, 70, 229, 0.22);
                transition: 0.25s;
            }

                .back-area button:hover {
                    transform: translateY(-2px);
                    box-shadow: 0 9px 20px rgba(79, 70, 229, 0.30);
                }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 600px) {

            .grammar-page {
                padding: 25px 15px;
            }

            .grammar-header {
                padding: 25px 15px;
            }

                .grammar-header h1 {
                    font-size: 27px;
                }

            .grammar-card {
                padding: 20px;
            }

                .grammar-card h2 {
                    font-size: 21px;
                }

            .answer-button {
                padding: 15px;
            }
        }
    </style>

</head>


<body>


    <!-- =========================================
         NAVIGATION
    ========================================= -->

    <header class="navbar">

        <div class="logo">
            🎓 EduConnect
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="student-dashboard.html">
                Dashboard
            </a>

            <a href="subjects.html">
                Subjects
            </a>

            <a href="english.html">
                English
            </a>

        </nav>

    </header>



    <!-- =========================================
         MAIN GRAMMAR PAGE
    ========================================= -->

    <main class="grammar-page">


        <!-- =====================================
             HEADER
        ====================================== -->

        <div class="grammar-header">

            <p class="welcome">
                ENGLISH
            </p>

            <h1>
                ✏️ Grammar Practice
            </h1>

            <div class="standard-badge">

                Standard
                <span id="standardNumber">
                    1
                </span>

            </div>

            <p id="grammarDescription">
                Grammar practice for your standard.
            </p>

        </div>



        <!-- =====================================
             GRAMMAR RULES CARD
        ====================================== -->

        <section class="grammar-card">

            <h2>
                📚 Learn Grammar
            </h2>

            <div id="grammarRules">

                Loading grammar...

            </div>

        </section>



        <!-- =====================================
             QUESTION CARD
        ====================================== -->

        <section class="grammar-card">

            <h2>
                🧠 Grammar Question
            </h2>

            <p id="grammarQuestion"
               class="question">

                Loading question...

            </p>

            <div id="answerContainer"></div>

            <p id="grammarResult"></p>

            <p id="grammarScore"></p>

        </section>



        <!-- =====================================
             BACK BUTTON
        ====================================== -->

        <div class="back-area">

            <button onclick="window.location.href='english.html'">

                ← Back to English

            </button>

        </div>


    </main>



    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>

        /* =========================================
           GET STUDENT STANDARD
        ========================================= */

        let standard =
            parseInt(
                localStorage.getItem("studentStandard")
            ) || 1;


        /* Make sure standard is 1–5 */

        if (
            standard < 1 ||
            standard > 5
        ) {

            standard = 1;

        }


        /* Display standard */

        document.getElementById(
            "standardNumber"
        ).textContent = standard;



        /* =========================================
           STANDARD-SPECIFIC GRAMMAR
        ========================================= */

        const grammarContent = {

            1: {

                description:
                    "Standard 1 Grammar - Learn simple sentences, naming words and action words.",

                rules: [

                    {
                        title: "Nouns",
                        example:
                            "A noun names a person, place, animal or thing. Example: cat."
                    },

                    {
                        title: "Verbs",
                        example:
                            "A verb shows an action. Example: The boy runs."
                    },

                    {
                        title: "Capital Letters",
                        example:
                            "Begin a sentence with a capital letter. Example: My cat is small."
                    }

                ],

                question:
                    "Which sentence is written correctly?",

                options: [
                    "The dog runs.",
                    "the dog runs.",
                    "The dog run.",
                    "the Dog runs."
                ],

                answer:
                    "The dog runs."

            },


            2: {

                description:
                    "Standard 2 Grammar - Practice nouns, verbs, adjectives and complete sentences.",

                rules: [

                    {
                        title: "Nouns",
                        example:
                            "A noun names a person, place, animal or thing. Example: teacher."
                    },

                    {
                        title: "Verbs",
                        example:
                            "A verb tells what someone or something does. Example: Birds fly."
                    },

                    {
                        title: "Adjectives",
                        example:
                            "An adjective describes a noun. Example: a red ball."
                    }

                ],

                question:
                    "Which word is the adjective in the sentence: The small bird sings?",

                options: [
                    "small",
                    "bird",
                    "sings",
                    "the"
                ],

                answer:
                    "small"

            },


            3: {

                description:
                    "Standard 3 Grammar - Practice parts of speech, punctuation and subject-verb agreement.",

                rules: [

                    {
                        title: "Adjectives",
                        example:
                            "Adjectives describe nouns. Example: The bright sun shines."
                    },

                    {
                        title: "Subject and Verb",
                        example:
                            "The subject and verb should agree. Example: She plays."
                    },

                    {
                        title: "Punctuation",
                        example:
                            "Use a question mark for a question. Example: Where are you?"
                    }

                ],

                question:
                    "Choose the correct sentence.",

                options: [
                    "She plays tennis every Sunday.",
                    "She play tennis every Sunday.",
                    "She playing tennis every Sunday.",
                    "She plays tennis every Sundays."
                ],

                answer:
                    "She plays tennis every Sunday."

            },


            4: {

                description:
                    "Standard 4 Grammar - Practice tenses, subject-verb agreement and sentence structure.",

                rules: [

                    {
                        title: "Present Tense",
                        example:
                            "The present tense describes actions that happen now or regularly. Example: He walks to school."
                    },

                    {
                        title: "Past Tense",
                        example:
                            "The past tense describes an action that already happened. Example: He walked to school."
                    },

                    {
                        title: "Subject-Verb Agreement",
                        example:
                            "A singular subject usually takes a singular verb. Example: The girl reads."
                    }

                ],

                question:
                    "Which sentence uses the past tense correctly?",

                options: [
                    "Ravi visited his grandmother yesterday.",
                    "Ravi visits his grandmother yesterday.",
                    "Ravi visiting his grandmother yesterday.",
                    "Ravi visit his grandmother yesterday."
                ],

                answer:
                    "Ravi visited his grandmother yesterday."

            },


            5: {

                description:
                    "Standard 5 Grammar - Practice tenses, conjunctions, sentence structure and accurate grammar.",

                rules: [

                    {
                        title: "Verb Tenses",
                        example:
                            "Verb tense shows when an action happens. Example: I studied yesterday."
                    },

                    {
                        title: "Conjunctions",
                        example:
                            "Conjunctions join words or ideas. Example: I stayed home because it rained."
                    },

                    {
                        title: "Sentence Structure",
                        example:
                            "A complete sentence expresses a complete idea. Example: The students finished their work."
                    }

                ],

                question:
                    "Which sentence uses the conjunction 'because' correctly?",

                options: [
                    "I stayed inside because it was raining.",
                    "I stayed inside because raining.",
                    "Because I stayed inside it.",
                    "I because stayed inside raining."
                ],

                answer:
                    "I stayed inside because it was raining."

            }

        };



        /* =========================================
           GET CURRENT GRAMMAR
        ========================================= */

        const currentGrammar =
            grammarContent[standard] ||
            grammarContent[1];



        /* =========================================
           DISPLAY DESCRIPTION
        ========================================= */

        document.getElementById(
            "grammarDescription"
        ).textContent =
            currentGrammar.description;



        /* =========================================
           DISPLAY GRAMMAR RULES
        ========================================= */

        const grammarRules =
            document.getElementById(
                "grammarRules"
            );


        currentGrammar.rules.forEach(
            function (rule) {

                const ruleItem =
                    document.createElement(
                        "div"
                    );

                ruleItem.className =
                    "rule-item";

                ruleItem.innerHTML =

                    '<div class="rule-title">' +
                    rule.title +
                    '</div>' +

                    '<div class="rule-example">' +
                    rule.example +
                    '</div>';


                grammarRules.appendChild(
                    ruleItem
                );

            }
        );



        /* =========================================
           DISPLAY QUESTION
        ========================================= */

        document.getElementById(
            "grammarQuestion"
        ).textContent =
            currentGrammar.question;



        /* =========================================
           CREATE ANSWER BUTTONS
        ========================================= */

        const answerContainer =
            document.getElementById(
                "answerContainer"
            );


        let answered = false;

        let score = 0;


        currentGrammar.options.forEach(
            function (option) {

                const button =
                    document.createElement(
                        "button"
                    );

                button.type = "button";

                button.className =
                    "answer-button";

                button.textContent =
                    option;

                button.onclick =
                    function () {

                        /* Prevent multiple answers */

                        if (answered) {

                            return;

                        }

                        answered = true;


                        /* Check answer */

                        if (
                            option ===
                            currentGrammar.answer
                        ) {

                            score = 1;

                            button.classList.add(
                                "correct"
                            );


                            document.getElementById(
                                "grammarResult"
                            ).textContent =
                                "✅ Correct! Great job!";

                        }

                        else {

                            score = 0;

                            button.classList.add(
                                "wrong"
                            );


                            /* Show correct answer */

                            const allButtons =
                                answerContainer.querySelectorAll(
                                    ".answer-button"
                                );


                            allButtons.forEach(
                                function (btn) {

                                    if (
                                        btn.textContent ===
                                        currentGrammar.answer
                                    ) {

                                        btn.classList.add(
                                            "correct"
                                        );

                                    }

                                }
                            );


                            document.getElementById(
                                "grammarResult"
                            ).textContent =
                                "❌ Not quite. The correct answer is shown in green.";

                        }


                        /* Disable all buttons */

                        const allButtons =
                            answerContainer.querySelectorAll(
                                ".answer-button"
                            );


                        allButtons.forEach(
                            function (btn) {

                                btn.disabled = true;

                            }
                        );


                        /* Save grammar score */

                        localStorage.setItem(
                            "englishGrammarScore",
                            score
                        );


                        localStorage.setItem(
                            "grammarScore",
                            score
                        );


                        /* Display score */

                        document.getElementById(
                            "grammarScore"
                        ).textContent =
                            "Grammar Score: " +
                            score +
                            "/1";

                    };


                answerContainer.appendChild(
                    button
                );

            }
        );

    </script>


</body>

</html>
